<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calorie Tracker</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        .container{
            width: 350px;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 10px;
        }

        input, button{
            padding: 10px;
            margin-top: 10px;
        }

        button{
            cursor: pointer;
        }

        p{
            font-size: 18px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Daily Calorie Tracker</h2>

        <input type="number" id="calorieInput" placeholder="Enter calories">

        <button onclick="addCalories()">Add Calories</button>

        <p id="totalCalories">Total Calories: 0</p>

        <p id="goalProgress">Daily Goal: 2000 Calories</p>

        <p id="feedback">Feedback: </p>

        <p id="entryCount">Entries: 0</p>
    </div>

    <script src="finalsummer25.js"></script>

</body>
</html>
